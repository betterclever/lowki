[package]
name = "lowki-site-prover"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Thin wasm-bindgen wrapper over lowki-groth16 (feature webgpu) for the showcase site"

# Standalone (no root workspace).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
lowki-groth16 = { path = "../../../crates/lowki-groth16", features = ["webgpu"] }
lowki-gpu = { path = "../../../crates/lowki-gpu" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
