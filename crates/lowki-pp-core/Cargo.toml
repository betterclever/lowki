[package]
name = "lowki-pp-core"
version = "0.1.0"
edition = "2024"
description = "Privacy Pools v1 note math (Poseidon, LeanIMT, signature-derived secrets, commitment/context/label), bit-exact with Kohaku"
license = "MIT"
publish = false

[workspace]

[dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.5", default-features = false }
light-poseidon = "0.4"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"

# Poseidon/ark arithmetic is very slow unoptimised; keep debug builds of deps fast.
[profile.dev.package."*"]
opt-level = 3
