[package]
name = "lowki-keys"
version = "0.1.0"
edition = "2024"
description = "Lowki key primitives: BIP-39, Kohaku-compatible BIP-32 keystore, per-app EOAs, passkey-PRF seed wrapping, secp256k1 signing"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
bip39 = { version = "2.2", default-features = false, features = ["zeroize"] }
hkdf = "0.12.4"
hmac = "0.12.1"
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "ecdsa", "sha256"] }
sha2 = { version = "0.10.9", default-features = false }
sha3 = { version = "0.10.8", default-features = false }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
