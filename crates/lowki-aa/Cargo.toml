[package]
name = "lowki-aa"
version = "0.1.0"
edition = "2024"
description = "Lowki: ERC-4337 v0.8 userOps, EIP-7702 authorizations and Kohaku Privacy Pools paymaster encodings"
license = "MIT"
publish = false

[workspace]

[dependencies]
alloy-primitives = { version = "1", default-features = false, features = ["std", "rlp"] }
alloy-sol-types = { version = "1", default-features = false, features = ["std"] }
alloy-rlp = { version = "0.3", default-features = false, features = ["std"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
