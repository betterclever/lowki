[package]
name = "lowki-gpu"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "WebGPU (wgpu + WGSL) multi-scalar multiplication for BN254 G1/G2, for the Lowki Groth16 prover; native (Metal/Vulkan) and wasm32 (browser WebGPU)"
publish = false

# Standalone crate (no root workspace yet).
[workspace]

[dependencies]
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "webgpu"] }
futures-channel = "0.3"
zeroize = "1.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[dev-dependencies]
pollster = "0.4"
ark-std = { version = "0.5.0", default-features = false, features = ["std"] }
rand_chacha = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"
wasm-bindgen = "=0.2.130"
js-sys = "0.3"

[profile.test]
opt-level = 3

[profile.dev.package.ark-ff]
opt-level = 3
[profile.dev.package.ark-ec]
opt-level = 3
[profile.dev.package.ark-bn254]
opt-level = 3
