[package]
name = "lowki-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "Benchmark harness: Lowki crates (native + wasm32) vs the TS libraries they reimplement"

# Standalone (no root workspace).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native"
path = "src/bin/native.rs"

[features]
default = ["keys", "pp", "stealth", "aa", "g16"]
keys = ["dep:lowki-keys"]
pp = ["dep:lowki-pp-core"]
stealth = ["dep:lowki-stealth"]
aa = ["dep:lowki-aa"]
g16 = ["dep:lowki-groth16"]
webgpu = ["g16", "lowki-groth16/webgpu", "dep:lowki-gpu"]
parallel = ["g16", "lowki-groth16/parallel"]
# Size probes: only export the API of one crate (see size/).
size-only = []

[dependencies]
lowki-keys = { path = "../../crates/lowki-keys", optional = true }
lowki-pp-core = { path = "../../crates/lowki-pp-core", optional = true }
lowki-stealth = { path = "../../crates/lowki-stealth", optional = true }
lowki-aa = { path = "../../crates/lowki-aa", optional = true }
lowki-groth16 = { path = "../../crates/lowki-groth16", optional = true }
lowki-gpu = { path = "../../crates/lowki-gpu", optional = true }
ark-ff = { version = "0.5", default-features = false }
ark-bn254 = { version = "0.5", default-features = false, features = ["scalar_field"] }
ark-poly = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
serde_json = "1"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
